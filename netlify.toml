[build]
  publish = "public"
  command = "npm install"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions.api]
  timeout = 26

[[redirects]]
  from = "/chat"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/commitments"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/commitments/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/alerts"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/alerts/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true
